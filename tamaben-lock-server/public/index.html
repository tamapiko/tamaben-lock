<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAMABEN LOCK | MDM Control Console</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon"></div>
        <div>
          <h1 class="logo-title">TAMABEN LOCK</h1>
          <p class="logo-sub">Apple MDM &amp; Supervision Controller</p>
        </div>
      </div>
      <div class="header-status">
        <div class="status-indicator" id="systemStatusIndicator">
          <span class="dot"></span>
          <span id="systemStatusText">読み込み中...</span>
        </div>
      </div>
    </header>

    <!-- Main Grid -->
    <main class="main-content">
      <!-- Quick Control Card -->
      <section class="card control-banner">
        <div class="control-left">
          <div class="lock-state-box">
            <span class="lock-state-label">現在のロック状態</span>
            <span class="lock-state-val" id="lockStateDisplay">未確定</span>
          </div>
          <div class="lock-meta">
            <span>モード: <strong id="lockModeDisplay">-</strong></span>
            <span>最終更新: <span id="lastUpdatedDisplay">-</span></span>
          </div>
        </div>
        <div class="control-actions">
          <button class="btn btn-primary" id="btnBlockApps">SNS・動画アプリを即時非表示</button>
          <button class="btn btn-warning" id="btnBlockAllFeatures" style="background: rgba(245, 158, 11, 0.2); border-color: #f59e0b; color: #fbbf24;">スマホ機能 丸ごと制限</button>
          <button class="btn btn-secondary" id="btnReleaseAdmin">全解除 (通常)</button>
        </div>
      </section>

      <!-- Registered Devices Section -->
      <section class="section">
        <div class="section-header">
          <h2>管理対象デバイス (Enrolled Devices)</h2>
          <button class="btn btn-sm btn-ghost" id="btnRefreshDevices">端末一覧を更新</button>
        </div>
        <div class="card" style="padding: 0; overflow: hidden; margin-bottom: 24px;">
          <table class="logs-table">
            <thead>
              <tr>
                <th>モデル / 端末名</th>
                <th>状態</th>
                <th>UDID</th>
                <th>OSバージョン</th>
                <th>最終通信</th>
                <th>遠隔アクション</th>
              </tr>
            </thead>
            <tbody id="devicesTableBody">
              <!-- JSでレンダリング -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- 8 Categories Grid -->
      <section class="section">
        <div class="section-header">
          <h2>ポリシーカテゴリー設定 (8 Domains)</h2>
          <div class="section-actions">
            <button class="btn btn-outline" id="btnPreviewProfile">一括プロファイル プレビュー</button>
            <a href="/api/profile?download=true" class="btn btn-outline">.mobileconfig ダウンロード</a>
          </div>
        </div>
        <div class="categories-grid" id="categoriesGrid">
          <!-- JSでレンダリング -->
        </div>
      </section>

      <!-- Audit Logs -->
      <section class="section">
        <div class="section-header">
          <h2>操作履歴 / 監査ログ (Audit Trail)</h2>
          <button class="btn btn-sm btn-ghost" id="btnRefreshLogs">更新</button>
        </div>
        <div class="card logs-card">
          <table class="logs-table">
            <thead>
              <tr>
                <th>日時</th>
                <th>アクション</th>
                <th>詳細</th>
                <th>操作者</th>
              </tr>
            </thead>
            <tbody id="logsTableBody">
              <!-- JSでレンダリング -->
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <!-- Profile Preview Modal -->
    <div class="modal-overlay" id="previewModal">
      <div class="modal-card">
        <div class="modal-header">
          <h3>一括構成プロファイル XML プレビュー</h3>
          <button class="modal-close" id="btnCloseModal">&times;</button>
        </div>
        <div class="modal-body">
          <pre><code id="profileXmlCode">読み込み中...</code></pre>
        </div>
        <div class="modal-footer">
          <a href="/api/profile?download=true" class="btn btn-primary">ダウンロード</a>
          <button class="btn btn-secondary" id="btnCloseModal2">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
